name: Build Fuji for macOS

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS App and DMG
        run: |
          pyinstaller --noconfirm Fuji.spec 2>&1 | tee build.log

      - name: Upload Build Log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Upload DMG artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FujiApp-DMG
          path: dist/*.dmg

      - name: Upload App Bundle artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Fuji-App-Bundle
          path: dist/Fuji.app

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          title: Fuji 1.2.0 (Patched with PR #40 & PR #43)
          body: |
            ### Fuji 1.2.0 for Apple Mac (macOS)
            
            Compiled automatically with fixes from Pull Requests:
            - **PR #40**: FileVault no-mount unlock and read-only mounting in Recovery mode
            - **PR #43**: Prevent Ditto acquisition from hanging on named pipes (FIFOs)
            - Fixed launcher executable bit permissions (`chmod 0o755`)
